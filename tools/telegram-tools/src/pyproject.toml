[project]
name = "telegram-tools"
version = "0.1.0"
description = "Telegram chat export (json/md) and message sender CLI"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]


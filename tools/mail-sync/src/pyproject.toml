[project]
name = "mail-sync"
version = "0.1.0"
description = "2-tier Gmail ingestion, decryption, and sync engine for financial statements & Obsidian"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
